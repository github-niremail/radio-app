<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radio Player • Time-Shift</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon-radio-512.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background-color: #f2f2f7; 
      display: flex; 
      flex-direction: column; 
      min-height: 100dvh; 
    }
    
    header { 
      background: #ffffff; 
      padding: 14px 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid #e5e5ea; 
      position: sticky; 
      top: 0; 
      z-index: 10; 
    }
    header span { 
      font-weight: 700; 
      font-size: 17px; 
      color: #1c1c1e; 
    }

    #main-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px 14px;
      flex: 1;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .app-card {
      background: #ffffff;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 13px; 
      color: #8e8e93; 
      font-weight: bold; 
      margin-bottom: 12px; 
    }

    /* Selector de idiomas y modos */
    .tab-group {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      background: #f8f9fa;
      font-size: 13px;
      font-weight: 600;
      color: #3a3a3c;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #007aff;
      color: #ffffff;
      border-color: #007aff;
    }
